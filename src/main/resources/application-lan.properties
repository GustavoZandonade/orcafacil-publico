# Perfil opcional para executar uma unica instancia na rede local.
# Sem um endereco informado, permanece acessivel apenas neste computador.
server.address=${ORCAFACIL_HOST:127.0.0.1}
server.port=8080

# Mesmo banco em arquivo usado pelo projeto original; nao e um banco em memoria.
spring.datasource.url=jdbc:h2:file:./data/orcafacil

# O navegador acessa a aplicacao, nunca o console administrativo do H2.
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

# Nao enviar detalhes internos em respostas de erro.
server.error.include-message=never
server.error.include-stacktrace=never
